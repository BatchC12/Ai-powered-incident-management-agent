<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8C6D53" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Espresso Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#12100E" stroke="#362F28" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M32 10 L14 18 v16 c0 13 8 22 18 26 c10 -4 18 -13 18 -26 V18 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)" />

  <!-- Inner Dark Shield Cutout -->
  <path d="M32 14 L18 20 v14 c0 10 6 18 14 21 c8 -3 14 -11 14 -21 V20 Z"
        fill="#12100E" />

  <!-- Center Pulse / Agent Node -->
  <circle cx="32" cy="31" r="5" fill="#D4AF37" />
  <path d="M22 31 h6 M36 31 h6" stroke="#C5A880" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 21 v6 M32 35 v6" stroke="#C5A880" stroke-width="2.5" stroke-linecap="round" />
</svg>