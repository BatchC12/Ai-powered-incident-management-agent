<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#070b14" stroke="#1e293b" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M32 10 L14 18 v16 c0 13 8 22 18 26 c10 -4 18 -13 18 -26 V18 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)" />

  <!-- Inner Dark Shield Cutout -->
  <path d="M32 14 L18 20 v14 c0 10 6 18 14 21 c8 -3 14 -11 14 -21 V20 Z"
        fill="#070b14" />

  <!-- Center Pulse / Agent Node -->
  <circle cx="32" cy="31" r="5" fill="#10b981" />
  <path d="M22 31 h6 M36 31 h6" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 21 v6 M32 35 v6" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
</svg>