<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Luxury Espresso Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100E" />
      <stop offset="50%" stop-color="#181512" />
      <stop offset="100%" stop-color="#0F0D0C" />
    </linearGradient>

    <!-- Luxury Gold to Cognac Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8C6D53" />
    </linearGradient>

    <radialGradient id="glowTopRight" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#A37B5C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#A37B5C" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowBottomLeft)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#2D2620" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Central Card -->
  <g transform="translate(100, 75)">
    <!-- Outer Card Border & Glow -->
    <rect width="1000" height="480" rx="28" fill="#1A1714" fill-opacity="0.9" stroke="#362F28" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Top Badge Row -->
    <g transform="translate(60, 55)">
      <!-- System Status Pill -->
      <rect width="210" height="34" rx="17" fill="#C5A880" fill-opacity="0.12" stroke="#C5A880" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#D4AF37" />
      <text x="36" y="22" fill="#D4AF37" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ITIL V3 MULTI-AGENT</text>

      <!-- Academic Attribution Pill -->
      <g transform="translate(225, 0)">
        <rect width="270" height="34" rx="17" fill="#8C6D53" fill-opacity="0.15" stroke="#8C6D53" stroke-width="1" />
        <text x="18" y="22" fill="#EAE2D8" font-family="Inter, sans-serif" font-size="12" font-weight="600">LATRACHE ET AL. (2015)</text>
      </g>
    </g>

    <!-- Main Title & Logo -->
    <g transform="translate(60, 140)">
      <!-- Logo Shield -->
      <rect width="72" height="72" rx="20" fill="url(#primaryGlow)" />
      <g transform="translate(16, 16)" stroke="#12100E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 3L4 9v10c0 11 8 21 16 24 8-3 16-13 16-24V9L20 3z" />
        <path d="M20 15v6" />
        <path d="M20 25h.01" />
      </g>

      <!-- Title Text -->
      <text x="96" y="44" fill="#F7F3EE" font-family="Cinzel, Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">MA-IMS</text>
      <text x="300" y="44" fill="#C5A880" font-family="Inter, sans-serif" font-size="28" font-weight="400">Incident Command Center</text>
      <text x="96" y="74" fill="#8C8479" font-family="Inter, sans-serif" font-size="16" font-weight="500">Autonomous ITIL Incident Lifecycle Automation &amp; Ontology Matchmaking</text>
    </g>

    <!-- 3 Core Feature Metrics Cards -->
    <g transform="translate(60, 270)">
      <!-- Card 1: 6 ITIL Agents -->
      <rect width="270" height="135" rx="18" fill="#201C18" stroke="#362F28" stroke-width="1.2" />
      <text x="24" y="38" fill="#C5A880" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="1">COLLABORATIVE ENGINE</text>
      <text x="24" y="78" fill="#F7F3EE" font-family="Inter, sans-serif" font-size="32" font-weight="900">6 Agents</text>
      <text x="24" y="108" fill="#8C8479" font-family="Inter, sans-serif" font-size="13" font-weight="500">User, Incident, Diagnostic, Support</text>

      <!-- Card 2: OWL Matchmaking -->
      <g transform="translate(305, 0)">
        <rect width="270" height="135" rx="18" fill="#201C18" stroke="#362F28" stroke-width="1.2" />
        <text x="24" y="38" fill="#D4AF37" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="1">SEMANTIC REASONING</text>
        <text x="24" y="78" fill="#F7F3EE" font-family="Inter, sans-serif" font-size="32" font-weight="900">4-Tuple OWL</text>
        <text x="24" y="108" fill="#8C8479" font-family="Inter, sans-serif" font-size="13" font-weight="500">Exact, Plug-in, Subsume scoring</text>
      </g>

      <!-- Card 3: Real-Time SLA -->
      <g transform="translate(610, 0)">
        <rect width="270" height="135" rx="18" fill="#201C18" stroke="#362F28" stroke-width="1.2" />
        <text x="24" y="38" fill="#B5C99A" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="1">SUPERVISOR ENGINE</text>
        <text x="24" y="78" fill="#F7F3EE" font-family="Inter, sans-serif" font-size="32" font-weight="900">Auto-Heal</text>
        <text x="24" y="108" fill="#8C8479" font-family="Inter, sans-serif" font-size="13" font-weight="500">Real-time MTTR countdowns</text>
      </g>
    </g>

    <!-- Bottom Footer Inside Card -->
    <g transform="translate(60, 442)">
      <text x="0" y="0" fill="#8C8479" font-family="JetBrains Mono, monospace" font-size="12">Institution: Vasireddy Venkatadri Institute of Technology (VVIT) • Batch CSM-C12</text>
      <text x="880" y="0" text-anchor="end" fill="#C5A880" font-family="JetBrains Mono, monospace" font-size="12">ONLINE • HTTPS ENFORCED</text>
    </g>
  </g>
</svg>
